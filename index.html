<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Thala 7 Sneaker Store</title>

        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <!-- HEADER -->

        <header class="header">

            <div class="container">

                <!-- Logo -->

                <div class="logo">
                    <h1>Thala-7</h1>
                </div>

                <!-- Navigation -->

                <nav class="nav">

                    <ul>

                        <li>
                            <a href="index.html">Home</a>
                        </li>

                        <li>
                            <a href="product.html">Product</a>
                        </li>

                        <li>
                            <a href="cart.html">Cart</a>
                        </li>

                        <li>
                            <a href="payment.html">Payment</a>
                        </li>

                    </ul>

                </nav>

                <!-- Search -->

                <div class="search-box">

                    <span>🔍</span>

                    <input
                        type="text"
                        placeholder="Search">

                </div>

                <!-- Cart -->

                <div class="cart-icon">

                    <a href="cart.html" aria-label="Shopping Cart">
                        🛒
                    </a>

                </div>

                <!-- User -->

                <div class="user-icon">

                    <button type="button" aria-label="User">
                        👤
                    </button>

                </div>

            </div>

        </header>

        <!-- MAIN -->

        <main class="home-main">

            <!-- HERO SECTION -->

            <section class="hero">

                <div class="container">

                    <!-- Left Content -->

                    <div class="left">

                        <h1>
                            7!! Thala for a Reason!
                        </h1>

                        <p>
                            Step into the world of style and comfort
                            with our exclusive sneaker collection.
                        </p>

                        <a href="product.html" class="btn">
                            Shop Now
                        </a>

                    </div>

                    <!-- Right Image -->

                    <div class="right">

                        <img
                            src="https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?q=80&w=387&auto=format&fit=crop"
                            alt="Sneakers">

                    </div>

                </div>

            </section>

            <!-- SERVICES SECTION -->

            <section class="services">

                <div class="container">

                    <div class="reviews">

                        <h2>2k+</h2>

                        <p>
                            Reviews
                        </p>

                    </div>

                    <div class="customer">

                        <h2>30k+</h2>

                        <p>
                            Customers
                        </p>

                    </div>

                    <div class="quality">

                        <h2>High</h2>

                        <p>
                            Quality
                        </p>

                    </div>

                    <div class="rating">

                        <h2>4.5/5</h2>

                        <p>
                            Rating
                        </p>

                    </div>

                </div>

            </section>

        </main>

    </body>

</html>
