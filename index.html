<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Thala 7 Sneaker Store</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <header class="header">
            <div class="container header-container">

                <div class="logo">
                    <h1>Thala-7</h1>
                </div>

                <nav class="nav">
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="product.html">Product</a></li>
                        <li><a href="cart.html">Cart</a></li>
                        <li><a href="payment.html">Payment</a></li>
                    </ul>
                </nav>

                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" placeholder="Search">
                </div>

                <div class="cart-icon">
                    <a href="cart.html">🛒</a>
                </div>

                <div class="user-icon">
                    <button type="button">👤</button>
                </div>

            </div>
        </header>

        <main class="home-main">

            <section class="hero">
                <div class="container hero-container">

                    <div class="hero-left">

                        <h1>7!! Thala for a Reason!</h1>

                        <p>
                            Step into the world of style and comfort with our
                            exclusive sneaker collection.
                        </p>

                        <a href="product.html" class="btn">Shop Now</a>

                    </div>

                    <div class="hero-right">

                        <img
                            src="https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?q=80&w=387&auto=format&fit=crop"
                            alt="Sneakers">

                    </div>

                </div>
            </section>

        </main>

        <section class="services">

            <div class="container services-container">

                <div class="service-box">
                    <h2>2k+</h2>
                    <p>Reviews</p>
                </div>

                <div class="service-box">
                    <h2>30k+</h2>
                    <p>Customers</p>
                </div>

                <div class="service-box">
                    <h2>High</h2>
                    <p>Quality</p>
                </div>

                <div class="service-box">
                    <h2>4.5/5</h2>
                    <p>Rating</p>
                </div>

            </div>

        </section>

        <script src="script.js"></script>

    </body>
</html>
