<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Thala 7 Sneaker Store</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <header class="header">

            <div class="container">

                <!-- Logo -->
                <div class="logo">
                    <h1>Thala-7</h1>
                </div>

                <!-- Navigation -->
                <nav class="nav">
                    <ul>
                        <li><a href="#">Home</a></li>
                        <li><a href="#">About</a></li>
                        <li><a href="#">Brands</a></li>
                        <li><a href="#">More</a></li>
                        <li><a href="#">Contact</a></li>
                    </ul>
                </nav>

                <!-- Search Box -->
                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" placeholder="Search">
                </div>

                <!-- Cart Icon -->
                <div class="cart-icon">
                    <button>🛒</button>
                </div>

                <!-- User Icon -->
                <div class="user-icon">
                    <button>👤</button>
                </div>

            </div>

        </header>
        <main>
            <section class="hero">
                <div class="container">
                    <div class="left">
                        <h1>7!! Thala for a Reason!</h1>
                        <p>Step into the world of style and comfort with our
                            exclusive sneaker collection.</p>
                        <a href="#" class="btn">Shop Now</a>
                    </div>
                    <div class="right">
                        <img
                            src="https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?q=80&w=387&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                            alt="Sneakers">
                    </div>
                </div>
            </section>
        </main>

    </body>
</html>
