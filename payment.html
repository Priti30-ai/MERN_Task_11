<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Payment - Thala 7 Sneaker Store</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <header class="header">
            <div class="container header-container">

                <div class="logo">
                    <h1>Thala-7</h1>
                </div>

                <nav class="nav">
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="product.html">Product</a></li>
                        <li><a href="cart.html">Cart</a></li>
                        <li><a href="payment.html">Payment</a></li>
                    </ul>
                </nav>

                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" id="paymentSearch" placeholder="Search">
                </div>

                <div class="cart-icon">
                    <a href="cart.html" aria-label="Shopping Cart">🛒</a>
                </div>

                <div class="user-icon">
                    <button type="button" aria-label="User">👤</button>
                </div>

            </div>
        </header>

        <main class="inner-page-main">

            <section class="payment-section">
                <div class="container payment-container">

                    <div class="payment-left">

                        <p class="checkout-title">CHECKOUT</p>
                        <h1>Complete Your Payment</h1>

                        <div
                            id="paymentSuccess"
                            class="payment-success"
                            style="display: none;">

                            ✅ Payment successful!
                            <br>
                            Thank you for shopping with Thala-7.
                            <br>
                            Your order has been placed.
                        </div>

                        <div id="paymentFormWrapper">

                            <div class="email-section">
                                <label for="email">Email Address</label>

                                <input
                                    type="email"
                                    id="email"
                                    placeholder="Enter your email"
                                    required>
                            </div>

                            <div class="payment-card">

                                <h2>Payment Details</h2>

                                <div class="payment-options">
                                    <button
                                        type="button"
                                        class="payment-option active"
                                        data-payment="card">
                                        💳 Card
                                    </button>

                                    <button
                                        type="button"
                                        class="payment-option"
                                        data-payment="upi">
                                        UPI
                                    </button>

                                    <button
                                        type="button"
                                        class="payment-option"
                                        data-payment="netbanking">
                                        Net Banking
                                    </button>
                                </div>

                                <form class="payment-form">

                                    <div class="input-group">
                                        <label for="card-name">Card Holder
                                            Name</label>

                                        <input
                                            type="text"
                                            id="card-name"
                                            placeholder="Enter card holder name"
                                            required>
                                    </div>

                                    <div class="input-group">
                                        <label for="card-number">Card
                                            Number</label>

                                        <input
                                            type="text"
                                            id="card-number"
                                            placeholder="Enter 16 digit card number"
                                            maxlength="16"
                                            inputmode="numeric"
                                            required>
                                    </div>

                                    <div class="input-row">

                                        <div class="input-group">
                                            <label for="expiry">Expiry
                                                Date</label>

                                            <input
                                                type="text"
                                                id="expiry"
                                                placeholder="MM/YY"
                                                maxlength="5"
                                                required>
                                        </div>

                                        <div class="input-group">
                                            <label for="cvv">CVV</label>

                                            <input
                                                type="password"
                                                id="cvv"
                                                placeholder="3 digit CVV"
                                                maxlength="3"
                                                inputmode="numeric"
                                                required>
                                        </div>

                                    </div>

                                    <button type="submit"
                                        class="payment-pay-now">
                                        Pay
                                        <span
                                            class="payment-pay-amount">₹0</span>
                                        Now
                                    </button>

                                </form>

                                <p class="payment-note">
                                    Your payment information is secure and
                                    protected.
                                </p>

                            </div>
                        </div>
                    </div>

                    <div class="payment-right">

                        <h2 class="order-heading">Order Summary</h2>

                        <div class="order-card">

                            <div id="orderProductList"></div>

                            <div class="order-details">
                                <div>
                                    <span>Sub Total</span>
                                    <span class="payment-subtotal">₹0</span>
                                </div>

                                <div>
                                    <span>Delivery</span>
                                    <span>Free</span>
                                </div>

                                <div class="order-total">
                                    <span>Total</span>
                                    <span class="payment-total">₹0</span>
                                </div>
                            </div>

                        </div>
                    </div>

                </div>
            </section>

        </main>

        <script src="script.js"></script>
    </body>
</html>
