<!DOCTYPE html>

<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Payment - Thala 7 Sneaker Store</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <!-- Header -->
        <header class="header">

            <div class="container">

                <!-- Logo -->
                <div class="logo">
                    <h1>Thala-7</h1>
                </div>

                <!-- Navigation -->
                <nav class="nav">
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="product.html">Product</a></li>
                        <li><a href="cart.html">Cart</a></li>
                        <li><a href="payment.html">Payment</a></li>
                    </ul>
                </nav>

                <!-- Search Box -->
                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" placeholder="Search">
                </div>

                <!-- Cart Icon -->
                <div class="cart-icon">
                    <button>🛒</button>
                </div>

                <!-- User Icon -->
                <div class="user-icon">
                    <button>👤</button>
                </div>

            </div>

        </header>

        <!-- Main Content -->
        <main>

            <!-- Payment / Checkout -->
            <section class="payment-section">

                <div class="payment-container">

                    <!-- Left Side - Checkout -->
                    <div class="payment-left">

                        <p class="checkout-title">
                            Checkout
                        </p>

                        <h1>
                            Contact Details
                        </h1>

                        <!-- Email -->
                        <div class="email-section">

                            <label for="email">
                                Email ID
                            </label>

                            <input
                                type="email"
                                id="email"
                                placeholder="Enter your email">

                        </div>

                        <!-- Payment Heading -->
                        <h1 class="payment-heading">
                            Payment
                        </h1>

                        <!-- Payment Card -->
                        <div class="payment-card">

                            <!-- Payment Options -->
                            <div class="payment-options">

                                <button class="payment-option active">

                                    <span class="payment-icon">
                                        ▣
                                    </span>

                                    <span>
                                        Card
                                    </span>

                                </button>

                                <button class="payment-option">

                                    <span class="payment-icon">
                                        ₿
                                    </span>

                                    <span>
                                        Crypto
                                    </span>

                                </button>

                                <button class="payment-option">

                                    <span class="payment-icon">
                                        ▤
                                    </span>

                                    <span>
                                        Bank
                                    </span>

                                </button>

                                <button class="payment-option">

                                    <span class="payment-icon">
                                        ⋮
                                    </span>

                                    <span>
                                        Other
                                    </span>

                                </button>

                            </div>

                            <!-- Card Number -->
                            <div class="input-group">

                                <label for="card-number">
                                    Card Number
                                </label>

                                <input
                                    type="text"
                                    id="card-number"
                                    placeholder="Enter card number">

                            </div>

                            <!-- Expiry + CVV -->
                            <div class="input-row">

                                <div class="input-group">

                                    <label for="expiry">
                                        Expiry
                                    </label>

                                    <input
                                        type="text"
                                        id="expiry"
                                        placeholder="MM/YY">

                                </div>

                                <div class="input-group">

                                    <label for="cvv">
                                        CVV
                                    </label>

                                    <input
                                        type="password"
                                        id="cvv"
                                        placeholder="***">

                                </div>

                            </div>

                            <!-- Country + ZIP -->
                            <div class="input-row">

                                <div class="input-group">

                                    <label for="country">
                                        Country
                                    </label>

                                    <select id="country">

                                        <option>
                                            India
                                        </option>

                                        <option>
                                            United States
                                        </option>

                                        <option>
                                            United Kingdom
                                        </option>

                                    </select>

                                </div>

                                <div class="input-group">

                                    <label for="zip">
                                        ZIP
                                    </label>

                                    <input
                                        type="text"
                                        id="zip"
                                        placeholder="XXXXX">

                                </div>

                            </div>

                        </div>

                    </div>

                    <!-- Right Side - Order Summary -->
                    <div class="payment-right">

                        <h1 class="order-heading">
                            Order Summary
                        </h1>

                        <div class="order-card">

                            <!-- Coupon -->
                            <div class="checkout-coupon">

                                <label for="checkout-coupon">
                                    Enter Coupon Code
                                </label>

                                <div class="checkout-coupon-box">

                                    <input
                                        type="text"
                                        id="checkout-coupon"
                                        placeholder="COUPON CODE">

                                    <button>
                                        Apply Coupon
                                    </button>

                                </div>

                            </div>

                            <!-- Order Details -->
                            <div class="order-details">

                                <div>
                                    <span>Sub Total</span>
                                    <span>₹4,700</span>
                                </div>

                                <div>
                                    <span>Taxes (if applicable)</span>
                                    <span>₹199</span>
                                </div>

                                <div>
                                    <span>Discount</span>
                                    <span>₹0</span>
                                </div>

                                <div class="order-total">
                                    <span>Total</span>
                                    <span>₹4,899</span>
                                </div>

                            </div>

                        </div>

                        <!-- Pay Now -->
                        <button class="payment-pay-now">
                            Pay Now ₹4,899
                        </button>

                        <!-- Payment Icons -->
                        <div class="checkout-payment-icons">

                            <span class="secure">
                                🔒 SECURE
                            </span>

                            <span class="razorpay">
                                Razorpay
                            </span>

                            <span class="upi">
                                UPI
                            </span>

                        </div>

                    </div>

                </div>

            </section>

        </main>

    </body>

</html>
