<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Payment - Thala 7 Sneaker Store</title>

        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <!-- HEADER -->

        <header class="header">

            <div class="container">

                <!-- Logo -->

                <div class="logo">
                    <h1>Thala-7</h1>
                </div>

                <!-- Navigation -->

                <nav class="nav">

                    <ul>

                        <li>
                            <a href="index.html">Home</a>
                        </li>

                        <li>
                            <a href="product.html">Product</a>
                        </li>

                        <li>
                            <a href="cart.html">Cart</a>
                        </li>

                        <li>
                            <a href="payment.html">Payment</a>
                        </li>

                    </ul>

                </nav>

                <!-- Search -->

                <div class="search-box">

                    <span>🔍</span>

                    <input
                        type="text"
                        placeholder="Search">

                </div>

                <!-- Cart -->

                <div class="cart-icon">

                    <a href="cart.html" aria-label="Shopping Cart">
                        🛒
                    </a>

                </div>

                <!-- User -->

                <div class="user-icon">

                    <button type="button" aria-label="User">
                        👤
                    </button>

                </div>

            </div>

        </header>

        <!-- MAIN -->

        <main>

            <section class="payment-section">

                <div class="payment-container">

                    <!-- LEFT SIDE - PAYMENT FORM -->

                    <div class="payment-left">

                        <p class="checkout-title">
                            Checkout
                        </p>

                        <h1>
                            Payment Details
                        </h1>

                        <!-- Email -->

                        <div class="email-section">

                            <label for="email">
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="email"
                                placeholder="Enter your email">

                        </div>

                        <!-- Payment Card -->

                        <div class="payment-card">

                            <h2>
                                Payment Method
                            </h2>

                            <!-- Payment Options -->

                            <div class="payment-options">

                                <button
                                    type="button"
                                    class="payment-option active">

                                    💳 Card

                                </button>

                                <button
                                    type="button"
                                    class="payment-option">

                                    📱 UPI

                                </button>

                                <button
                                    type="button"
                                    class="payment-option">

                                    🏦 Net Banking

                                </button>

                            </div>

                            <!-- Card Number -->

                            <div class="input-group">

                                <label for="card-number">
                                    Card Number
                                </label>

                                <input
                                    type="text"
                                    id="card-number"
                                    placeholder="1234 5678 9012 3456">

                            </div>

                            <!-- Expiry + CVV -->

                            <div class="input-row">

                                <div class="input-group">

                                    <label for="expiry">
                                        Expiry Date
                                    </label>

                                    <input
                                        type="text"
                                        id="expiry"
                                        placeholder="MM / YY">

                                </div>

                                <div class="input-group">

                                    <label for="cvv">
                                        CVV
                                    </label>

                                    <input
                                        type="text"
                                        id="cvv"
                                        placeholder="CVV">

                                </div>

                            </div>

                            <!-- Name -->

                            <div class="input-group">

                                <label for="card-name">
                                    Name on Card
                                </label>

                                <input
                                    type="text"
                                    id="card-name"
                                    placeholder="Enter name on card">

                            </div>

                            <!-- Country + ZIP -->

                            <div class="input-row">

                                <div class="input-group">

                                    <label for="country">
                                        Country
                                    </label>

                                    <select id="country">

                                        <option>
                                            India
                                        </option>

                                        <option>
                                            United States
                                        </option>

                                        <option>
                                            United Kingdom
                                        </option>

                                    </select>

                                </div>

                                <div class="input-group">

                                    <label for="zip">
                                        ZIP Code
                                    </label>

                                    <input
                                        type="text"
                                        id="zip"
                                        placeholder="ZIP Code">

                                </div>

                            </div>

                            <!-- Pay Now -->

                            <button
                                type="submit"
                                class="payment-pay-now">

                                Pay Now ₹4,899

                            </button>

                            <p class="payment-note">
                                🔒 Your payment information is secure.
                            </p>

                        </div>

                    </div>

                    <!-- RIGHT SIDE - ORDER SUMMARY -->

                    <div class="payment-right">

                        <h2 class="order-heading">
                            Order Summary
                        </h2>

                        <div class="order-card">

                            <!-- Product -->

                            <div class="order-product">

                                <img
                                    src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=300&auto=format&fit=crop"
                                    alt="Seven By M.S.Dhoni Women's Shoes">

                                <div>

                                    <h3>
                                        Seven By M.S.Dhoni Women's Shoes
                                    </h3>

                                    <p>
                                        Quantity: 1
                                    </p>

                                    <strong>
                                        ₹4,999
                                    </strong>

                                </div>

                            </div>

                            <!-- Order Details -->

                            <div class="order-details">

                                <div>

                                    <span>
                                        Subtotal
                                    </span>

                                    <span>
                                        ₹4,700
                                    </span>

                                </div>

                                <div>

                                    <span>
                                        Taxes
                                    </span>

                                    <span>
                                        ₹199
                                    </span>

                                </div>

                                <div>

                                    <span>
                                        Discount
                                    </span>

                                    <span>
                                        ₹0
                                    </span>

                                </div>

                                <div class="order-total">

                                    <span>
                                        Total
                                    </span>

                                    <span>
                                        ₹4,899
                                    </span>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </section>

        </main>

    </body>

</html>
