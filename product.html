<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Product - Thala 7 Sneaker Store</title>

        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <!-- HEADER -->

        <header class="header">

            <div class="container">

                <!-- Logo -->
                <div class="logo">
                    <h1>Thala-7</h1>
                </div>

                <!-- Navigation -->
                <nav class="nav">

                    <ul>

                        <li>
                            <a href="index.html">Home</a>
                        </li>

                        <li>
                            <a href="product.html">Product</a>
                        </li>

                        <li>
                            <a href="cart.html">Cart</a>
                        </li>

                        <li>
                            <a href="payment.html">Payment</a>
                        </li>

                    </ul>

                </nav>

                <!-- Search -->
                <div class="search-box">

                    <span>🔍</span>

                    <input
                        type="text"
                        placeholder="Search">

                </div>

                <!-- Cart -->
                <div class="cart-icon">

                    <a href="cart.html" aria-label="Shopping Cart">
                        🛒
                    </a>

                </div>

                <!-- User -->
                <div class="user-icon">

                    <button type="button" aria-label="User">
                        👤
                    </button>

                </div>

            </div>

        </header>

        <!-- MAIN -->

        <main>

            <!-- PRODUCT DISPLAY -->

            <section class="display">

                <div class="container">

                    <!-- LEFT - PRODUCT IMAGE -->

                    <div class="left-show">

                        <div class="main-image">

                            <img
                                src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                                alt="Seven By M.S.Dhoni Women's Shoes">

                        </div>

                    </div>

                    <!-- RIGHT - PRODUCT DETAILS -->

                    <div class="right-show">

                        <div class="product-details">

                            <h1>
                                Seven By M.S.Dhoni Women's Shoes
                            </h1>

                            <p class="description">
                                Stylish and comfortable sneakers designed
                                for everyday use. Get the perfect combination
                                of comfort, quality and style.
                            </p>

                            <!-- Price -->

                            <div class="price-section">

                                <h2>
                                    ₹1,334
                                </h2>

                                <div class="sale">

                                    <span>
                                        73% OFF
                                    </span>

                                    <p>
                                        Limited Time Offer
                                    </p>

                                </div>

                            </div>

                            <!-- Quantity + Add To Cart -->

                            <div class="product-actions">

                                <div class="quantity">

                                    <button type="button">
                                        −
                                    </button>

                                    <span>
                                        2
                                    </span>

                                    <button type="button">
                                        +
                                    </button>

                                </div>

                                <a
                                    href="cart.html"
                                    class="add-cart">

                                    🛒 Add to Cart

                                </a>

                            </div>

                        </div>

                    </div>

                </div>

                <!-- PRODUCT GALLERY -->

                <div class="gallery">

                    <div class="gallery-item">

                        <img
                            src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                            alt="Shoe Image 1">

                    </div>

                    <div class="gallery-item">

                        <img
                            src="https://images.unsplash.com/photo-1549298916-b41d501d3772?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                            alt="Shoe Image 2">

                    </div>

                    <div class="gallery-item">

                        <img
                            src="https://images.unsplash.com/photo-1552346154-21d32810aba3?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                            alt="Shoe Image 3">

                    </div>

                    <div class="gallery-item">

                        <img
                            src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                            alt="Shoe Image 4">

                    </div>

                    <div class="gallery-item">

                        <img
                            src="https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                            alt="Shoe Image 5">

                    </div>

                </div>

            </section>

        </main>

    </body>

</html>
